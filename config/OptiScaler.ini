; -------------------------------------------------------
[V-Sync]

; -------------------------------------------------------
; Enable V-Sync controls
; true or false - Default (auto) is false
OverrideVsync = auto

; Force V-Sync value
; true or false - Default (auto) is none selected
ForceVsync = auto

; Sync interval value for V-Sync
; 0 to 3 - Default (auto) is none selected
SyncInterval = auto


; -------------------------------------------------------
[Anisotropy]

; -------------------------------------------------------
; Override max Anisotropy/Anisotropic Filtering for textures
; 2, 4, 8, 16 - Default (auto) is disabled
AnisotropyOverride = auto

; Change comparison filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyComparison = auto

; Change min/max filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyMinMax = auto

; Skip overriding on point filters
; true or false - Default (auto) is true
SkipPointFilter = auto


; -------------------------------------------------------
[Mipmap]

; -------------------------------------------------------
; Override value for Mipmap LOD bias
; -15.0 - 15.0 - Default (auto) is disabled
MipmapBiasOverride = auto

; Use a fixed value for LOD bias 
; true or false - Default (auto) is false
MipmapBiasFixedOverride = auto

; Use override value as scale multiplier 
; true or false - Default (auto) is false
MipmapBiasScaleOverride = auto

; Override all textures LOD bias (normally only overriding < 0 values)
; true or false - Default (auto) is false
MipmapBiasOverrideAll = auto


; -------------------------------------------------------
[ProcessFilter]

; -------------------------------------------------------
; Only inject into this specific process (case-insensitive)
; Example: TargetProcessName=endfield.exe
; Default (auto) is disabled (injects into all processes)
TargetProcessName = auto

; Don't inject into this specific process (case-insensitive)
; Process names seperated with pipe "|" - Default (auto) is 
; crashpad_handler.exe and others - listed in Config.h under ProcessFilter
ProcessExclusionList = auto


; -------------------------------------------------------
[Hotfix]

; -------------------------------------------------------
; Enables checking for latest version from Github
; true or false - Default (auto) is false
CheckForUpdate = auto

; Enables blocking of Steam and Epic overlays
; Also blocks Steam Input
; true or false - Default (auto) is false, except for OptiFG when true
DisableOverlays = auto

; Use manual input polling instead of hooking WndProc
; Might help games which does not capture inputs properly
; As a downside it will not be able to block inputs when menu is open
; true or false - Default (auto) is false
ManualInputPolling = auto

; Simulate waitable object event signals for FG swapchain
; true or false - Default (auto) is false
SimulateWaitableObject = auto

; OptiScaler will delay loading of Reshade and create D3D12 device first
; This option will prevent warnings/crashes with Luma and some other ReShade mods
; When using Luma mod and this will be enabled
; true or false - Default (auto) is false
CreateD3D12DeviceForLuma = auto

; OptiScaler will try to force High Performance GPU
; true or false - Default (auto) is false
PreferDedicatedGpu = auto

; OptiScaler will report only first High Performance GPU
; true or false - Default (auto) is false
PreferFirstDedicatedGpu = auto

; Rounds internal resolutions width and height to multiple of this value
; 2, 4, 8, 16 ...  - Default (auto) is disabled
RoundInternalResolution = auto

; Skips upscaling of n frames
; n is integer number  - Default (auto) is disabled
SkipFirstFrames = auto

; Restore last used compute signature after upscaling
; true or false - Default (auto) is false
RestoreComputeSignature = auto

; Restore last used graphics signature after upscaling
; true or false - Default (auto) is false
RestoreGraphicSignature = auto

; Tries to track signature changes to fully restore them
; Useful for games using bindless
; true or false - Default (auto) is false
ExtendedStateRestore = auto

; Use precompiled shaders for RCAS, Output Scaling and Mask Bias
; true or false - Default (auto) is true
UsePrecompiledShaders = auto

; Color texture resource state to fix for rainbow colors on AMD cards (for mostly UE games) 
; For UE engine games on AMD, set Color to 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier = auto

; For UE engine games on AMD, set MotionVector to 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier = auto
DepthResourceBarrier = auto
ColorMaskResourceBarrier = auto
ExposureResourceBarrier = auto
OutputResourceBarrier = auto


; Default (auto) is state correction disabled
; These settings defines each resources initial resource 
; state and add resource barrier for correct state
;
; Common resource barrier states
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; All state values can be checked from here
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states
[DlssNr]

; OptScaler(NR) 1.13.3.4 - Three-backend AMD Neural Rendering (DLSS 5 on AMD), before or after SR.
; Synthesizes detail and denoises ray-traced inputs at the selected processing stage.

; Enables DLSS-NR at the selected processing stage
; true or false - Program default is false. Setup turns this on.
Enabled = true

; Processing order (DX12 and DX11/Vulkan-to-DX12 bridges).
; true = NR -> SR (default); false = SR -> NR (experimental, more GPU time/VRAM at display resolution).
; Mochizuki keeps render-resolution motion and the runtime scales it. Daniel and lmxxf resample guides.
; Program and package default: true. Daniel and lmxxf stay at 1..3 passes. Mochizuki uses a 1..3 slider, or a separate 30-layer mode.
; SR runs once; all NR layers run at the selected stage, then the combined result is written once.
; Save Settings and restart if command-list ownership was not armed. Native RR/Vulkan are not added.
; Unsupported output/guide layouts leave the SR image unchanged; see Ins status. Switching clears history.
RunBeforeSR = auto

; Optional XeFG override while NR is actually running. 0/auto = no override.
; Generated-frame count: 1 = 2X, 2 = 3X, 3 = 4X, etc. Requires live multiplier support.
; Never rewrites [XeFG] InterpolationCount. Capability limits affect only the applied value.
XeFGInterpolationCount = auto

; Selects the neural rendering backend
; lmxxf  - Open-source AMD HIP neural rendering pipeline (using native-game-tiled-assets)
; daniel - danielblnc 0.3.0-0.6.0 runtime (using dlssnr_amd_pass*.dll + weights.bin)
; mochizuki - Native D3D12 / Vulkan bridge, RDNA4; see docs/mochizuki.md.
; lmxxf, daniel or mochizuki. Turn the pass off with Enabled=false.
; If the chosen host is missing its files, the other installed host runs instead.
NrBackend = mochizuki

; Independent Mochizuki controls (copied from the source template).
; Mochizuki v0.0.4: independent settings; see docs/mochizuki.md.
; Includes the HDR hue fix from upstream v0.0.4 (Linux-only release); Windows INT4 is not enabled.
; Pass 1 model strength. Independent of final Overall Intensity; default 1.
MochizukiIntensity = auto

; Pass 1 style: 0 Standard, 1 Natural, 2 Cinematic. Default 0.
MochizukiStyle = auto

; Pass 1 model tone response, default 1.
MochizukiLocalTone = auto

; Pass 1 structure response, default 1.
MochizukiLocalStructure = auto

; Pass 1 skin structure: -1 follows LocalStructure.
MochizukiSkinStructure = auto

; Use the model character mask. Default true.
MochizukiAutomaticMask = auto

; Final detail blend; default 1. Does not reduce network work.
MochizukiDetailStrength = auto

; Final colour blend; default 1.
MochizukiColourStrength = auto

; Highlight ratio guard for output blending; default 2.
MochizukiMaxRatio = auto

; Reduced model resolution only: 0 matched residual (default), 1 edge-aware, 2 classic.
; Classic uses MochizukiClassicScaler. Edge-aware and classic cost more GPU time. No effect at 100% model scale.
MochizukiEnlargeMode = auto

; Classic enlargement: 0 bilinear, 1 Catmull-Rom (default), 2 Lanczos3, 3 FSR1. Used when EnlargeMode is 2.
MochizukiClassicScaler = auto

; ACO fast mode (experimental). Default true. Save Settings, then restart the game.
; A missing bundle, record mismatch or unsupported driver keeps the driver's compiler.
MochizukiAcoMode = auto

; Network model: 0 = 310.8.0 original, 1 = 310.9.16 new (default).
; The new model needs dlssnr-small.bin; without it the original model runs.
; INT4 mixed requires model 0. Model and INT4 preferences are saved independently.
MochizukiNetworkModel = auto

; Windows 0.0.5 optional INT4 and RenoDX processing.
; Ctrl+F11 toggles this request; Save Settings persists it. Requires effective ACO; otherwise the default network runs.
MochizukiInt4Mixed = auto
MochizukiRenoDX = auto
MochizukiNoiseEveryFrame = auto
MochizukiRenoNeuralUplift = auto
MochizukiRenoIntensity = auto
MochizukiRenoStyle = auto
MochizukiRenoLocalTone = auto
MochizukiRenoLocalStructure = auto
MochizukiRenoSkinStructure = auto
MochizukiRenoAutoMask = auto
MochizukiRenoSkinIndependent = auto
MochizukiRenoPasses = auto
MochizukiRenoUnlockPasses = auto
MochizukiRenoChainedHistory = auto
MochizukiRenoPass2Transfer = auto
MochizukiRenoPass2Color = auto
MochizukiRenoPass2Intensity = auto
MochizukiRenoPass2FollowPass1 = auto
MochizukiRenoPass2Style = auto
MochizukiRenoPass2LocalTone = auto
MochizukiRenoPass2Structure = auto
MochizukiRenoPass2Skin = auto
MochizukiRenoPass2AutoMask = auto
MochizukiRenoPass3Transfer = auto
MochizukiRenoPass3Color = auto
MochizukiRenoPass3Intensity = auto
MochizukiRenoPass3FollowPass1 = auto
MochizukiRenoPass3Style = auto
MochizukiRenoPass3LocalTone = auto
MochizukiRenoPass3Structure = auto
MochizukiRenoPass3Skin = auto
MochizukiRenoPass3AutoMask = auto
MochizukiRenoPass4Transfer = auto
MochizukiRenoPass4Color = auto
MochizukiRenoPass4Intensity = auto
MochizukiRenoPass4FollowPass1 = auto
MochizukiRenoPass4Style = auto
MochizukiRenoPass4LocalTone = auto
MochizukiRenoPass4Structure = auto
MochizukiRenoPass4Skin = auto
MochizukiRenoPass4AutoMask = auto
MochizukiRenoColorStrength = auto
MochizukiRenoTransferStrength = auto
MochizukiRenoChromaClamp = auto
MochizukiRenoTransferMode = auto
MochizukiRenoStyleHighlightGuard = auto
MochizukiRenoDetailStability = auto
MochizukiRenoResolutionScale = auto
MochizukiRenoFollowInputRes = auto
MochizukiRenoLookUpsample = auto
MochizukiRenoLookMode = auto
MochizukiRenoLookStrength = auto
MochizukiRenoLookBrighten = auto
MochizukiRenoLookDarken = auto
MochizukiRenoLookColour = auto
MochizukiRenoLookHue = auto
MochizukiRenoLookShadows = auto
MochizukiRenoLookMidtones = auto
MochizukiRenoLookHighlights = auto
MochizukiRenoLookMaxBrighten = auto
MochizukiRenoLookMaxDarken = auto
MochizukiRenoLookMaxColour = auto
MochizukiRenoLookTone = auto
MochizukiRenoLookDetail = auto
MochizukiRenoLookDetailRadius = auto
MochizukiRenoLookHalo = auto
MochizukiRenoLookHaloBrightSide = auto
MochizukiRenoLookStabilize = auto
MochizukiRenoLookStabilizeMs = auto
MochizukiRenoLookStabilizeDetail = auto
MochizukiRenoSdrBlackRestore = auto
MochizukiRenoDisplayPedestal = auto
MochizukiRenoCodecMode = auto
MochizukiRenoNeuralFloorGuard = auto
MochizukiRenoSourceEncoding = auto
MochizukiRenoLinearUnitNits = auto
MochizukiRenoProxyAnchor = auto
MochizukiRenoPaperWhiteScale = auto
MochizukiRenoDiffuseWhiteNits = auto
MochizukiRenoPQCalibration = auto
MochizukiRenoFeedMode = auto
MochizukiRenoNormGovernor = auto
MochizukiRenoNormCutAware = auto
MochizukiRenoNormAttackStops = auto
MochizukiRenoNormReleaseStops = auto
MochizukiRenoNormSlewStops = auto
MochizukiRenoMVecScaleX = auto
MochizukiRenoMVecScaleY = auto

; Reuse the private full-resolution copy for the final output. Saves one RGBA32F image.
; Defaults on; 8-bit/native-compose paths keep their existing buffers. Toggle rebuilds the network.
MochizukiCompactTransfer = auto

; Manual white point for linear input; default 1. Separate from preprocessing exposure.
MochizukiWhitePoint = auto

; Input resolution scale, 0.25..1. Default 1. Higher costs more GPU time/VRAM and can rebuild.
MochizukiModelScale = auto

; Allow pass counts above 3, up to 30. Default false. Off keeps MochizukiPasses at 1..3.
; On does not force 30. Pick the count with MochizukiPasses. Higher counts rebuild and cost more GPU time.
MochizukiUnlockPasses = auto

; Ignored. Older builds used 1 to force exactly 30 layers. The count is MochizukiPasses.
MochizukiLayerMode = auto

; Active passes. 1..3, or 1..30 while MochizukiUnlockPasses is true. Default 1.
; Applies when editing finishes. A higher count can rebuild the network.
MochizukiPasses = auto

; Enable temporal history with supported unjittered motion vectors; unavailable vectors disable history.
MochizukiTemporal = auto

; Hold NR off for the rest of the session when too many command lists arrive without a
; recording proxy. Unwrapped lists fall back to the original colour, so a high miss rate
; makes NR and the original alternate frame by frame (visible flicker). Default false.
MochizukiProxyFallbackEnabled = auto

; Linear-input level (only affects linear/HDR colour; MochizukiWhitePoint stays the trim).
; WhitePointSource: where the linear white point comes from. Default 0. No rebuild; next frame.
;   0 = off: manual MochizukiWhitePoint only (unchanged look).
;   1 = game: the game's exposure (DLSS exposure texture x DLSS_Exposure_Scale / DLSS_Pre_Exposure,
;       or 1/DLSS_Pre_Exposure without a texture); manual when the game gives none.
;   2 = meter: always meter the frame (highlight-clipped mean, 1 frame late), ignoring the game; manual until metered.
;   3 = auto: game exposure if usable, else meter, else manual.
; Try 2 or 3 when skin looks red/oversaturated at NrOverallIntensity > 1 (e.g. Monster Hunter Wilds).
MochizukiWhitePointSource = auto

; Temporal history strength; default 1. Requires Temporal and valid motion vectors.
MochizukiHistoryStrength = auto

; Transform model input and reverse the transform on output. Default false; changes may rebuild.
MochizukiPreprocess = auto

; Preprocessing exposure: 0 Off, 1 Auto, 2 Fixed. Default 1; only used with Preprocess.
MochizukiPreprocessExposure = auto

; Preprocessing exposure bias in EV; default 0.
MochizukiPreprocessBiasEv = auto

; Curve: 0 None, 1 Neutral, 2 Reinhard, 3 Filmic, 4 GT, 5 ACES, 6 AgX. Default 3.
MochizukiPreprocessCurve = auto

; Preprocessing contrast; default 1.
MochizukiPreprocessContrast = auto

; Preprocessing saturation; default 1.
MochizukiPreprocessSaturation = auto

; Apply the model result. false still runs the network; disable NR to save computation.
MochizukiApplyModel = auto

; Input encoding: 0 Auto, 1 Linear, 2 Encoded. Default 0; changes can rebuild.
MochizukiLinearInput = auto

; Prebuild capacity: 0 auto, or 1..3 (1..30 while MochizukiUnlockPasses is true).
; Auto retains capacity when passes decrease. An explicit count is at least the active passes.
MochizukiMaxPasses = auto

; DRS: 0 Exact, 1 Auto bucket, 2 Always bucket. Buckets reduce repeated builds; default 1.
MochizukiDynamicResolution = auto

; Pass 2: Enable independent pass settings. false inherits pass 1 except LocalTone=0. Used when this pass is active and Override=true.
MochizukiPass2Override = auto

; Pass 2: Style: 0 Standard, 1 Natural, 2 Cinematic. Used when this pass is active and Override=true.
MochizukiPass2Style = auto

; Pass 2: Model intensity for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass2Intensity = auto

; Pass 2: Model tone for this pass, default 0. Used when this pass is active and Override=true.
MochizukiPass2LocalTone = auto

; Pass 2: Structure response for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass2LocalStructure = auto

; Pass 2: Skin structure: -1 follows this pass LocalStructure. Used when this pass is active and Override=true.
MochizukiPass2SkinStructure = auto

; Pass 2: Use model character mask for this pass; default true. Used when this pass is active and Override=true.
MochizukiPass2AutomaticMask = auto

; Pass 3: Enable independent pass settings. false inherits pass 1 except LocalTone=0. Used when this pass is active and Override=true.
MochizukiPass3Override = auto

; Pass 3: Style: 0 Standard, 1 Natural, 2 Cinematic. Used when this pass is active and Override=true.
MochizukiPass3Style = auto

; Pass 3: Model intensity for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass3Intensity = auto

; Pass 3: Model tone for this pass, default 0. Used when this pass is active and Override=true.
MochizukiPass3LocalTone = auto

; Pass 3: Structure response for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass3LocalStructure = auto

; Pass 3: Skin structure: -1 follows this pass LocalStructure. Used when this pass is active and Override=true.
MochizukiPass3SkinStructure = auto

; Pass 3: Use model character mask for this pass; default true. Used when this pass is active and Override=true.
MochizukiPass3AutomaticMask = auto

; Hot-switch preparation (menu: Allow backend hot switching).
; 0: start only the selected backend; changing backends needs a game restart.
; 1 (package default): prepare command-list proxy so installed backends can switch in-session.
; Hook/wrap policy is chosen at startup: restart the game after changing this.
; NR off still releases session buffers after outstanding work; daniel keeps its model cache.
NrConvenience = auto

; Optional asynchronous NR/codec/effects measurement; default off.
; Ins: Measure NR performance. Page Up opens the FPS overlay; Page Down changes detail.
; Logging also needs measurement and file logging; at most one summary per five seconds.
NrTimingEnabled = auto
NrTimingLog = auto

; One-switch flicker capture: coverage details, frame trace, game-thread timing and file logging.
; Save and restart after changing. Does not alter inline, barrier, wrapping or picture settings.
NrFlickerDiag = auto
NrFrameDiag = auto

; Game-thread wait timing (needs NrFrameDiag): Present -> first submit and fence waits, gw_* fields. Timestamps only.
NrGameWaitDiag = auto

; Shared final-output blend for either AMD backend. 0..2, default 1.
; 0 shows the original but still runs NR; disable NR to save model computation.
NrOverallIntensity = auto

; Experimental shared spatial residual shaping, after backend history, before overall intensity.
; Low/detail gains: 0..2, default 1/1. Does not add network passes or blur original detail.
; Skin/edge detail protection: 0..1, default 0/0 (off). Only constrains introduced fine detail.
; Skin is a colour heuristic, NOT person detection; warm scenery may also be affected.
; These are not temporal anti-flicker. Test HDR/fast motion before enabling by default.
; Neutral 1/1/0/0 keeps the old output path. Pure-backend sessions may need a restart.
; Experimental person protection: scene uses final NR; multi-pass people use pass 1.
; lmxxf/Mochizuki single/multi-pass. Single pass needs a control below 1; Daniel is not supported.
; Requires matching person-model/person-worker.exe, ONNX Runtime CPU x64 API 23+
; and the selected ONNX model. The worker uses private CRT DLLs; game-root CRT is untouched.
; (COCO FP32, input 1x3x640x640). Model availability depends on the installed package.
; Missing/stale masks or unreliable motion/depth preserve final NR. Default off.
NrPersonPartition = auto

; Person model: 0 = PP-HumanSeg (body, default), 1 = YOLO11n-seg (body), 2 = YuNet (face only).
; Only one model runs. YuNet uses yunet.onnx and soft face ovals; small/turned/occluded faces may be missed.
NrPersonModel = auto

; YuNet full-frame input: 320 (default), 384, 416 or 448. Larger inputs cost more CPU but can detect smaller faces.
; Other models ignore this setting. Invalid sizes use 320.
NrFaceInputSize = auto

; Person controls: 0..1, default 1. Single pass uses final NR; multi-pass uses pass 1.
; Strength 0 retains the NR input inside the mask, before shared output effects.
; Detail reduces only fine NR changes. Backend character/skin settings are not modified.
NrPersonStrength = auto
NrPersonDetailGain = auto
NrPersonDebugMask = auto
NrResidualLowGain = auto
NrResidualDetailGain = auto
NrResidualSkinProtection = auto
NrResidualEdgeProtection = auto

; Shared temporal residual filtering; requires motion/depth. Off by default.
; May soften moving detail or trail; adds GPU work and history memory.
; Alpha 0..0.95; threshold 0..16 (compressed-colour units of 1/255). Either zero bypasses it.
NrStabilizerEnabled = auto
NrStabilizerAlpha = auto
NrStabilizerThreshold = auto

; lmxxf network style: 0 / 1 / 2. Default 1; other upstream numeric changes can still change the image.
; Separate from Daniel Style and shared NrOverallIntensity. Live change rebuilds the network.
DLSS5_STYLE = auto

; Native model temporal history (anti-flicker). 1-3 passes before SR, with valid motion/depth guides; default on.
; Only the final real pass uses history/exports its temporal weight; predicted pass 3 uses pass 2 weight.
; Can reduce flicker, but adds GPU/VRAM cost and may soften moving detail or cause ghosting.
; Temporarily disables adaptive ViT reuse to avoid flicker. Saved reuse settings are retained and resume when history is off.
LmxxfModelHistory = auto

; lmxxf temporal mode: 0 = Off, 1 = Full model history (default, 1-3 passes before SR with motion/depth),
; 2 = Low-frequency stabilization (single-pass before SR with motion), 3 = Residual enhance (single-pass before SR with motion).
DLSS5_TEMPORAL_MODE = auto

; Mode 3 residual temporal enhancement gain: 0.0..2.0, default 1.0.
DLSS5_TEMPORAL_ENHANCE_STRENGTH = auto

; 1080-tier processing rows: 1152 (default), or 1088 (Compact 1080 network).
; 1088 changes the image, especially near the bottom edge. Live change rebuilds the network.
DLSS5_NETWORK_1080_ROWS = auto

; Additional supported colour formats use private FP16 output. Default true.
; Save Settings and restart the game after changing this.
DLSS5_FORMAT_FALLBACK = auto

; Native NR input resolution at the selected stage (render before SR, display after SR).
; true by default; overrides tier/Compact 1080 within the supported budget.
; Larger input costs more GPU time and VRAM (4K can be several times 1080p). Outside the budget, use the tier below.
; Changing native resolution, fast numeric, passes or block skipping rebuilds the network on the next frame.
DLSS5_NETWORK_FREE_RES = auto

; Fast approximate C32/C64/C128, ViT and C512 arithmetic (0.41). Default true; false uses normal numeric modules.
DLSS5_FAST_NUMERIC = auto

; Requested network passes per frame: 1..3, default 1. More style and extra frame buffers. See third-pass prediction below.
; Adaptive ViT reuse is disabled with 2/3 passes. GPU network timing includes all passes.
; Original or Small model. Small runs once; Original pass preference is retained.
; 0 = Original (default), 1 = Small (requires native-game-tiled-assets/small)
LmxxfNetworkModel = 0
DLSS5_MULTI_PASS = 1

; Only at 3 passes: true runs two real network passes then predicts the third locally (lossy, default true).
; false runs three real passes. No effect at 1/2 passes. Changing this rebuilds the network.
DLSS5_MULTI_PASS_PREDICT = auto

; At 2/3 passes, keep first-pass skin tones using a color heuristic (not segmentation). Default false.
DLSS5_MULTI_PASS_SKIN_PROTECT = auto

; Ins > Advanced Kernels: both skip lists are adjacent, with no extra subgroup.
; Base skip list for all real network passes (lmxxf). Default none; 42,43,46 restores the old lossy skip.
; Comma list of 1..38,40..69. Cannot skip 5..22 or 48..65 while MH byte stream is on.
; Blocks 4/69 are also unsupported. Changing this rebuilds the network on the next frame.
DLSS5_SKIP_BLOCKS = none

; Added to the base list only in real network passes 2/3. Default none; ignored at 1 pass.
; A predicted third pass has no extra network blocks. Gains are small and style changes (lossy).
; CSV 1..38,40..69; blocks 4/69 and byte-stream blocks 5..22,48..65 are unsupported; invalid combinations use none.
DLSS5_MULTI_PASS_SKIP_BLOCKS = none

; Automatic network tier, or fixed 720 / 900 / 1080. Used with native resolution off, or outside its supported budget.
DLSS5_NETWORK_HEIGHT = auto

; Shared allocation / byte-stream paths; defaults match the product runtime.
DLSS5_HIP_SHARED_POOL = auto
DLSS5_HIP_MH_BYTE_STREAM = auto
DLSS5_HIP_DECODER_BYTE = auto

; danielblnc math quality (0.4.2+). Not a menu-under-Display fold; Ins shows Quality near the top.
; 0 = Reference (NVIDIA-exact arithmetic, default)
; 1 = Fast (cheaper math; usually visually equivalent and faster)
; RX 7000 always runs Reference inside the daniel runtime.
Quality = auto

; Diagnostic mode for lmxxf backend (most modes skip NR)
; off               - Normal neural rendering
; original          - Pass through the game colour (no NR)
; copy-current      - Copy current frame colour (diagnostic)
; staging-current   - Staging isolation, current frame
; staging-previous  - Staging isolation, previous frame
; proxy-original    - Open-list proxy, original colour
; split-original    - Split list then original colour
; codec-passthrough - Encode to decode without the network (no HIP)
; hip-passthrough   - RGB conversion and HIP shared-buffer round trip, no per-frame NR
; Model initialization/warm-up still runs; hip-passthrough skips all neural passes afterwards.
; Default is off. INI only; fully restart after changing, restore off after testing.
; Invalid values do not enable NR.
LmxxfDiagnostic = off

; Fit Color inputs above 1920x1080 onto the 1080 network (same name as env/txt)
; Live from the Ins menu (runtime re-reads the env whenever it checks FitLarge). true/false - Default is true
DLSS5_FIT_LARGE = auto

; PDL chained launch. true by default. false sets DLSS5_HIP_PDL=0 so a driver
; without hipExtModuleLaunchKernel can still start the network. Restart after changing.
DLSS5_HIP_PDL = auto

; Wave-owned attention kernels (C32/C64/C128 + C256 attention). Default true (official 0.31+ template).
; false restores the older multi-wave path. Applies on network rebuild.
DLSS5_HIP_WAVE_OWNED = auto

; C512 QKV/mix at 32 tokens per wave. Default true. false restores the previous C512 path.
DLSS5_HIP_C512_M32 = auto

; ViT projection 64 columns per wave. Default true. false restores fragment projection.
DLSS5_HIP_VIT_PROJ_N64 = auto

; C256 persistent queue (swin-persistent module, 0.37). Default true.
; Active only on 1920x1152 or 1600x960 processing with wave-owned compatible options.
; false or missing module falls back to normal launches. DLSS5_HIP_SWIN_RUN=0/1 overrides.
DLSS5_HIP_SWIN_RUN = auto

; Exact typed ViT edges (official 0.35+ template default 3).
; 0=off (old f32 ViT path), 1=AV FP8, 2=contract F16, 3=Both.
; Mutually exclusive with DLSS5_HIP_VIT_BYTE_STREAM. Applies on network rebuild.
DLSS5_HIP_VIT_STREAM = auto

; ViT byte stream (experimental). Default 0. Only when VIT_STREAM is not an explicit non-zero value.
; 1 also turns off adaptive reuse. Applies on network rebuild.
DLSS5_HIP_VIT_BYTE_STREAM = auto

; Adaptive ViT reuse (lossy): when the picture is nearly still, reuse ViT across frames.
; Configure reuse in the Ins menu. No F8 polling; motion returns to full ViT.
; Default below is performance-oriented (looser than upstream 4 / 0.22 / 1 / 0.35):
; higher FPS when nearly still, more risk of stale detail / ghosting on subtle motion.
; Inactive while LmxxfModelHistory is enabled; the saved reuse preference is retained.
DLSS5_VIT_ADAPTIVE = auto
DLSS5_VIT_REUSE_PERIOD = auto
DLSS5_VIT_REUSE_GLOBAL = auto
DLSS5_VIT_REUSE_LOCAL = auto
DLSS5_VIT_REUSE_IMAGE = auto

; Codec paper white for lmxxf encode and decode. Finite and in (0, 64]. Default is 1.
; Not the HDR Paper White anchor.
LmxxfPaperWhite = auto

; Auto exposure when the game sends no exposure texture (default true).
; true = measure mean brightness each frame and smooth it over time (ignores LmxxfAutoExposureScale).
; false = use the fixed scale below.
LmxxfAutoExposure = auto

; Manual white scale only when Auto exposure is false and there is no game exposure. Default 8.
LmxxfAutoExposureScale = auto

; Allow NR when the command list uses D3D12 enhanced barriers. auto uses these game rules:
; on when the EXE name contains "forza" (Forza Horizon 6 needs it for Mochizuki), off otherwise.
; Enhanced-barrier layout/access is not fully tracked and a split can cut a SYNC_SPLIT
; group across two submits. true opts in; false rejects those lists. Menu changes apply immediately.
LmxxfAllowEnhancedBarriers = auto

; Early command-list wrap: shared by lmxxf and Mochizuki. auto uses the game rules below.
; Auto: EXE calls in Unreal/Forza; UnityPlayer.dll calls in Aniimo.exe only.
; true = EXE plus loaded UnityPlayer.dll callers, including other Unity games.
; false = disable both early paths; normal post-swapchain wrapping is unchanged.
; Ins > Compatibility & Scheduling > Early command-list wrap. Save and restart.
; Other games are unvalidated; forced early wrap can crash (e.g. Yan Yun).
LmxxfEarlyExeWrap = auto

; Early wrap of command lists created by ANY module (Streamline, dxgi proxies, overlays), before the
; swapchain only. auto: on only when the EXE name contains "forza". Independent of
; LmxxfEarlyExeWrap. May crash other games; try true only if the log shows many 'missing recording proxy'.
LmxxfEarlyAnyModuleWrap = auto

; Resolution scale factor for neural rendering model input
; 1.0 = native render resolution (e.g. 720p for 4K Super Performance)
; float value - Default is 1
AmdModelScale = auto

; Encoding format mode for model inputs/outputs
; 0 = FP16 (standard), 1 = FP8 / compressed
; Integer value - Default is 0
AmdEncoding = auto

; Schedule neural rendering execution on every frame
; When enabled, avoids skipping frames; multi-slot pipeline skips post-execute wait
; true or false - Default is true
AmdEveryFrame = auto

; Number of pipeline slots for asynchronous GPU execution (danielblnc backend)
; Higher values reduce wait time at the cost of VRAM (each slot holds intermediate buffers)
; Recommended: 3 slots (tested 0 wait on yysls)
; 1 to 5 - Default is 3
AmdSlots = auto

; GPU synchronization / wait mode between NR and game command queue (danielblnc backend)
; 0 = Original wait (compute dispatch spin)
; 1 = New wait mode (1-pixel graphics draw spin; prevents GPU watchdog resets)
; 0 or 1 - Default is 1
AmdGraphicsWait = auto

; Allow unsafe dirty command insertion when graphics state admission fails
; 0 = Safe mode (fallback to original color on state conflict)
; 1 = Unsafe mode (force injection; higher risk of visual glitch)
; 0 or 1 - Default is 0
AmdGraphicsUnsafe = auto

; Experimental neural lighting pass (Gather/Resolve shaders)
; true or false - Default is true
